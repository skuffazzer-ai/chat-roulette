<!-- Локальная камера -->
<div class="local-video-wrapper">
  <video id="localVideo" autoplay muted playsinline></video>
  <div class="controls">
    <button id="flipBtn">🔄</button>       <!-- переворот камеры -->
    <button id="startBtn">▶️</button>     <!-- начать -->
    <button id="stopBtn" style="display:none;">⏹️</button> <!-- завершить -->
    <button id="nextBtn" style="display:none;">⏭️</button> <!-- следующий -->
  </div>
</div>

<!-- Камера собеседника -->
<div class="remote-video-wrapper">
  <video id="remoteVideo" autoplay playsinline></video>
  <div class="remote-controls">
    <button id="reportBtn">⚠️</button>    <!-- жалоба -->
    <button id="muteBtn">🔇</button>      <!-- мут -->
    <button id="giftBtn">🎁</button>      <!-- подарок -->
    <button id="likeBtn">❤️</button>      <!-- лайк -->
  </div>
</div>
