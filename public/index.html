<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Chat Roulette</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="videos-container">
  <div class="local-video-wrapper">
    <video id="localVideo" autoplay muted playsinline></video>

    <!-- Мои кнопки -->
    <button id="flipBtn">🔄</button>
    <button id="micBtn">🎤</button>
    <button id="startBtn">▶️</button>
    <button id="stopBtn">⏹️</button>
    <button id="nextBtn">⏭️</button>
  </div>

  <div class="remote-video-wrapper">
    <video id="remoteVideo" autoplay playsinline></video>

    <!-- Кнопки собеседника -->
    <button id="likeBtn">❤️</button>
    <button id="reportBtn">⚠️</button>
    <button id="muteBtn">🔇</button>
    <button id="giftBtn">🎁</button>
  </div>
</div>

<!-- Чат поверх видео -->
<div class="chat-overlay">
  <div id="chatMessagesOverlay" class="chat-messages-overlay"></div>
</div>

<!-- Стандартный чат-блок -->
<div class="chat-container">
  <div id="chatMessages" class="chat-messages"></div>
</div>

<div class="chat-input-fixed">
  <input type="text" id="chatInput" placeholder="Напишите сообщение..." />
  <button id="sendBtn">Отправить</button>
</div>

<script src="script.js"></script>
</body>
</html>
