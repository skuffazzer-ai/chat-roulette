<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Chat Roulette 18+</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 18+ предупреждение -->
<div id="ageGate" class="age-gate">
  <h2>ВНИМАНИЕ: 18+</h2>
  <p>Сайт содержит откровенный контент сексуального характера. Продолжая, вы подтверждаете, что вам исполнилось 18 лет.</p>
  <button id="confirmAgeBtn">Мне 18+, продолжить</button>
</div>

<div id="mainContent" class="hidden">
  <div class="videos-container">
    <div class="local-video-wrapper">
      <video id="localVideo" autoplay muted playsinline></video>
      <div class="controls">
        <button id="flipBtn" class="hidden">🔄</button>
        <button id="micBtn" class="hidden">🎤</button>
        <button id="startBtn">▶️</button>
        <button id="stopBtn" class="hidden">⏹️</button>
        <button id="nextBtn" class="hidden">⏭️</button>
      </div>
    </div>
    <div class="remote-video-wrapper">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="remote-controls">
        <button id="reportBtn" class="hidden">⚠️</button>
        <button id="likeBtn" class="hidden">❤️</button>
        <button id="muteRemoteBtn" class="hidden">🔇</button>
        <button id="giftBtn" class="hidden">🎁</button>
      </div>
    </div>
  </div>

  <div class="chat-container">
    <div id="chatMessages" class="chat-messages"></div>
  </div>

  <div class="chat-input-fixed">
    <input type="text" id="chatInput" placeholder="Напишите сообщение..." />
    <button id="sendBtn">Отправить</button>
  </div>
</div>

<!-- Модалка жалобы -->
<div id="reportModal" class="modal hidden">
  <div class="modal-content">
    <h3>Пожаловаться на пользователя</h3>
    <button onclick="sendReport('minor')">🚫 Несовершеннолетний</button>
    <button onclick="sendReport('violence')">🤢 Шок / насилие</button>
    <button onclick="sendReport('spam')">📵 Спам / реклама</button>
    <button onclick="sendReport('aggression')">😡 Агрессия</button>
    <button onclick="closeReport()">Отмена</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
