<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Chat Roulette</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="videos-container">

  <!-- Локальное видео -->
  <div class="local-video-wrapper">
    <video id="localVideo" autoplay muted playsinline></video>
    <div class="controls">
      <button id="flipBtn">🔄</button> <!-- переворот камеры -->
      <button id="startBtn">▶️</button> <!-- Начать -->
      <button id="stopBtn" style="display:none;">⏹️</button> <!-- Завершить -->
      <button id="nextBtn" style="display:none;">⏭️</button> <!-- Следующий -->
    </div>
  </div>

  <!-- Видео собеседника -->
  <div class="remote-video-wrapper">
    <video id="remoteVideo" autoplay playsinline></video>
    <div class="remote-controls">
      <button id="likeBtn">❤️</button>
      <button id="reportBtn">⚠️</button>
      <button id="muteBtn">🔇</button>
      <button id="giftBtn">🎁</button>
    </div>
  </div>

</div>

<!-- Чат -->
<div class="chat-container">
  <div id="chatMessages" class="chat-messages"></div>
</div>

<div class="chat-input-fixed">
  <input type="text" id="chatInput" placeholder="Напишите сообщение..." />
  <button id="sendBtn">Отправить</button>
</div>

<script src="script.js"></script>
</body>
</html>
